# Arquitectura hexagonal – microservicio modular
# Cada módulo tiene su Dockerfile y su propio contenedor.
# Build context: raíz del repo (.) para ambos servicios.
#
# Bases de datos:
# - PostgreSQL (SQL): usuarios, paquetes (HU-01 a HU-06)
# - MongoDB (NoSQL): seguimiento de paquetes (HU-07, HU-08)

services:
  # ============================================
  # BASES DE DATOS
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: logistics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistics_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: logistics_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: tracking_db
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # MICROSERVICIOS
  # ============================================
  users-api:
    build:
      context: .
      dockerfile: src/modules/users/Dockerfile
    container_name: logistics_users_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 2001
      API_PREFIX: api
      SWAGGER_ENABLED: 'true'
      SWAGGER_PATH: api/docs
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: logistics_db
      RUN_MIGRATIONS: 'true'
      HEALTH_DB_TIMEOUT_MS: 1500
      JWT_SECRET: ${JWT_SECRET:-tata-logistics-7xK9mP2nQ5vR8wY1zB4cF6hJ0sL3uW7xA9dG2eI5kM8pS1tV4yZ6bN0oC}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
    ports:
      - '2001:2001'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:2001/api/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  packages-api:
    build:
      context: .
      dockerfile: src/modules/packages/Dockerfile
    container_name: logistics_packages_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      users-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 2002
      API_PREFIX: api
      SWAGGER_ENABLED: 'true'
      SWAGGER_PATH: api/docs
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: logistics_db
      RUN_MIGRATIONS: 'false'
      HEALTH_DB_TIMEOUT_MS: 1500
      USERS_API_URL: http://users-api:2001
      JWT_SECRET: ${JWT_SECRET:-tata-logistics-7xK9mP2nQ5vR8wY1zB4cF6hJ0sL3uW7xA9dG2eI5kM8pS1tV4yZ6bN0oC}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
    ports:
      - '2002:2002'

  tracking-api:
    build:
      context: .
      dockerfile: src/modules/tracking/Dockerfile
    container_name: logistics_tracking_api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      packages-api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 2003
      API_PREFIX: api
      SWAGGER_ENABLED: 'true'
      SWAGGER_PATH: api/docs
      SWAGGER_TITLE: 'API Tracking - Seguimiento de Paquetes'
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/tracking_db?authSource=admin
      PACKAGES_API_URL: http://packages-api:2002
      HEALTH_DB_TIMEOUT_MS: 1500
      JWT_SECRET: ${JWT_SECRET:-tata-logistics-7xK9mP2nQ5vR8wY1zB4cF6hJ0sL3uW7xA9dG2eI5kM8pS1tV4yZ6bN0oC}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
    ports:
      - '2003:2003'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:2003/api/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  mongodb_data:
